services:
  - type: web
    name: access-guardian
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    disk:
      name: access-guardian-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ACCESS_GUARDIAN_DATABASE
        value: /var/data/access-guardian.sqlite3
      - key: ACCESS_GUARDIAN_AXE_PATH
        value: /app/frontend/node_modules/axe-core/axe.min.js
      - key: ACCESS_GUARDIAN_ALLOWED_SCAN_PORTS
        value: 80,443
      - key: PYTHONUNBUFFERED
        value: "1"
